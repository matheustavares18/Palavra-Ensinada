:root{--bg:#efe6d6;--fg:#2a1d12;--acc:#a8741a;--panel:#e2d6c0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14110e;--fg:#f3e6c8;--acc:#ffd84d;--panel:#231c16}}
:root[data-theme="dark"]{--bg:#14110e;--fg:#f3e6c8;--acc:#ffd84d;--panel:#231c16}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px}
#stage{width:min(92vw,calc((100vh - 150px) * 0.5625),576px);aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#stage svg{width:100%;height:100%;display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:576px;width:100%}
.bar button,.bar select,.bar label.btn{background:var(--panel);color:var(--fg);border:1px solid rgba(128,128,128,.35);border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer}
#seek{flex:1;min-width:160px;accent-color:var(--acc)}
#tm{font-variant-numeric:tabular-nums;font-size:13px;opacity:.8}
.note{font-size:12px;opacity:.7;max-width:576px;text-align:center}
body.render .bar,body.render .note{display:none}
body.render .wrap{padding:0}
body.render #stage{width:576px;height:1024px;border-radius:0;box-shadow:none}
body.h #stage{aspect-ratio:16/9;width:min(92vw,960px)}
body.render.h #stage{width:1024px;height:576px}
