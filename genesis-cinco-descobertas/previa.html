:root{--bg:#efe6d6;--fg:#2a1d12;--acc:#a8741a;--panel:#e2d6c0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14110e;--fg:#f3e6c8;--acc:#ffd84d;--panel:#231c16}}
:root[data-theme="dark"]{--bg:#14110e;--fg:#f3e6c8;--acc:#ffd84d;--panel:#231c16}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px}
#stage{width:min(92vw,calc((100vh - 150px) * 0.5625),576px);aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#stage svg{width:100%;height:100%;display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:576px;width:100%}
.bar button,.bar select,.bar label.btn{background:var(--panel);color:var(--fg);border:1px solid rgba(128,128,128,.35);border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer}
#seek{flex:1;min-width:160px;accent-color:var(--acc)}
#tm{font-variant-numeric:tabular-nums;font-size:13px;opacity:.8}
.note{font-size:12px;opacity:.7;max-width:576px;text-align:center}
body.render .bar,body.render .note{display:none}
body.render .wrap{padding:0}
body.render #stage{width:576px;height:1024px;border-radius:0;box-shadow:none}

<div class="wrap"><span style="font-family:Cinzel;font-weight:900;position:absolute;opacity:0;pointer-events:none">ÁÉ</span>
<div id="stage"></div>
<div class="bar">
<button id="pp">▶</button><input id="seek" type="range" min="0" step="0.01" value="0"><span id="tm">0:00</span>
</div>
<div class="bar">
<select id="mode"><option value="full">Vídeo completo</option><option value="1">Short 1 · Estrelas</option><option value="2">Short 2 · Enoque</option><option value="3">Short 3 · Tebá</option><option value="4">Short 4 · Agar</option><option value="5">Short 5 · Cobertura</option></select>
<label class="btn">Carregar narração (mp3)<input id="mp3" type="file" accept="audio/*" hidden></label><span id="mp3l" style="font-size:12px"></span>
<label style="font-size:13px"><input id="safe" type="checkbox"> área segura</label>
</div>

</div>
<audio id="narr"></audio>
<script>
// ===== Utilitários =====
const W = 576, H = 1024;
const f1 = n => (Math.round(n * 10) / 10).toString();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => (k = clamp(k, 0, 1), k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const easeOut = k => (k = clamp(k, 0, 1), 1 - Math.pow(1 - k, 3));
const pop = k => { k = clamp(k, 0, 1); const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function shade(hex, amt) {
  let c = hex.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join('');
  let r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}
let _uid = 0; const uid = p => p + (++_uid);

// ===== Elementos de cenário vivos =====
function starsField(t, n, seed, y0 = -300, y1 = 700, big = 1) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const x = -300 + rnd(seed + i) * (W + 600), y = y0 + rnd(seed + i * 3.7) * (y1 - y0);
    const r = (0.6 + rnd(seed + i * 9.1) * 1.6) * big;
    const tw = 0.55 + 0.45 * Math.sin(t * (0.8 + rnd(i) * 1.5) + i);
    s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="#fff" opacity="${f1(tw * 0.9)}"/>`;
  }
  return s;
}
function starShape(x, y, r, fill, rot = 0, op = 1) {
  let d = '';
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r; d += (i ? 'L' : 'M') + f1(x + Math.cos(a) * rr) + ' ' + f1(y + Math.sin(a) * rr); }
  return `<path d="${d}Z" fill="${fill}" opacity="${op}"/>`;
}
function clouds(t, y, n, seed, col = '#fff', op = .85, speed = 6, sc = 1) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const w = (70 + rnd(seed + i) * 90) * sc;
    let x = -250 + ((rnd(seed + i * 2) * (W + 500) + t * speed * (0.6 + rnd(i) * .8)) % (W + 500));
    const yy = y + rnd(seed + i * 5) * 120;
    s += `<g opacity="${op}" fill="${col}"><ellipse cx="${f1(x)}" cy="${f1(yy)}" rx="${f1(w)}" ry="${f1(w * .32)}"/><ellipse cx="${f1(x - w * .35)}" cy="${f1(yy - w * .12)}" rx="${f1(w * .45)}" ry="${f1(w * .3)}"/><ellipse cx="${f1(x + w * .25)}" cy="${f1(yy - w * .2)}" rx="${f1(w * .5)}" ry="${f1(w * .38)}"/></g>`;
  }
  return s;
}
function birds(t, n, seed, y, col = '#2b2b3a', sc = 1) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const sp = 22 + rnd(seed + i) * 20;
    const x = -100 + ((rnd(seed + i * 3) * 900 + t * sp) % 900);
    const yy = y + rnd(seed + i * 7) * 140 + Math.sin(t * 1.3 + i) * 8;
    const fl = Math.sin(t * 9 + i * 2) * 5;
    const k = (0.7 + rnd(seed + i * 11) * .6) * sc;
    s += `<path d="M${f1(x - 9 * k)} ${f1(yy - fl * k)} Q${f1(x - 4 * k)} ${f1(yy - 3 * k)} ${f1(x)} ${f1(yy)} Q${f1(x + 4 * k)} ${f1(yy - 3 * k)} ${f1(x + 9 * k)} ${f1(yy - fl * k)}" stroke="${col}" stroke-width="${f1(2 * k)}" fill="none" stroke-linecap="round"/>`;
  }
  return s;
}
function butterflies(t, n, seed, x0, y0, w, h) {
  let s = ''; const cols = ['#f5b942', '#e86a92', '#7fc8f8', '#f7f7f7'];
  for (let i = 0; i < n; i++) {
    const x = x0 + w * (0.5 + 0.5 * Math.sin(t * 0.35 + i * 2.1 + seed));
    const y = y0 + h * (0.5 + 0.5 * Math.sin(t * 0.5 + i * 1.3));

const KEYWORDS = [
  ['estrelas', 'star'], ['estrela', 'star'], ['sol', 'sun'], ['lua', 'moon'], ['luzeiros', 'bigsmall'], ['luzeiro', 'bigsmall'],
  ['divindades', 'idol'], ['deuses', 'idol'], ['adoracao', 'idol'], ['galaxias', 'galaxy'], ['universo', 'galaxy'], ['ceus', 'galaxy'],
  ['criador', 'sparkle'], ['criacao', 'sparkle'], ['importa', 'heart'], ['davi', 'harp'], ['salmo', 'harp'],
  ['morreu', 'candleOut'], ['morte', 'candleOut'], ['genealogia', 'scroll'], ['nomes', 'scroll'], ['trezentos', 'hourglass'],
  ['caminhada', 'steps'], ['caminhar', 'steps'], ['andou', 'steps'], ['comunhao', 'heart'], ['agradado', 'heart'], ['testemunho', 'scroll'],
  ['presenca', 'light'], ['tomou', 'light'], ['arca', 'ark'], ['teba', 'hebrew'], ['hebraica', 'hebrew'], ['cesto', 'basket'],
  ['diluvio', 'rain'], ['aguas', 'wave'], ['nilo', 'wave'], ['rio', 'wave'], ['farao', 'crown'], ['egito', 'pyramid'],
  ['lembrou', 'dove'], ['nacao', 'people'], ['pequeno', 'seed'], ['deserto', 'dune'], ['gravida', 'baby'], ['filho', 'baby'],
  ['fonte', 'drop'], ['nome', 'tag'], ['ouve', 'ear'], ['ouviu', 'ear'], ['ve', 'eye'], ['via', 'eye'], ['el roi', 'eye'],
  ['aflicao', 'tear'], ['dores', 'tear'], ['sofrimento', 'tear'], ['folhas', 'leaf'], ['figueira', 'leaf'], ['peles', 'fur'], ['vestimentas', 'fur'],
  ['pecado', 'chain'], ['animal', 'lamb'], ['cordeiro', 'lamb'], ['cruz', 'cross'], ['graca', 'gift'], ['redencao', 'key'], ['salvacao', 'key'],
  ['maos', 'hands'], ['biblia', 'book'], ['escrituras', 'book'], ['genesis', 'book'], ['inscreva', 'bell'], ['notificacoes', 'bell'],
  ['jornada', 'steps'], ['provisao', 'gift'], ['provê', 'gift'], ['prove', 'gift'], ['ismael', 'ear'],
];
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function findKeyword(text) {
  const n = norm(text);
  let best = null;
  for (const [k, ic] of KEYWORDS) {
    const re = new RegExp('(^|[^a-z])' + k.replace(' ', '\\s') + '([^a-z]|$)');
    const m = re.exec(n);
    if (m && (!best || m.index < best.idx)) best = { k, ic, idx: m.index };
  }
  return best;
}

S.arkBoard = (t, p) => {

  s += `<g transform="translate(330,640) scale(1.05)">${ark(0, 0, 1, 0, 0, { animals: 0 }).replace(/^<g transform="[^"]*">/, '<g>')}</g>`;
  s += `<path d="M376 560 L120 760 L150 772 L400 590Z" fill="${gVert('#8b5a2b', .15, -.25)}"/>${[...Array(9)].map((_, i) => `<line x1="${f1(372 - i * 28)}" y1="${f1(566 + i * 21.5)}" x2="${f1(394 - i * 28)}" y2="${f1(592 + i * 20)}" stroke="#5a3a1c" stroke-width="1.6"/>`).join('')}`;
  // fila de pares subindo a rampa
  const pairs = [['lion', 0], ['lion', 1], ['ele', 0], ['ele', 1], ['gir', 0], ['gir', 1], ['zeb', 0], ['zeb', 1], ['cam', 0], ['cam', 1], ['ox', 0], ['ox', 1], ['sheep', 0], ['sheep', 1]];

    s += `<g transform="translate(${f1(x)},${f1(y)}) scale(${f1(sc2)})" opacity="${f1(op)}">${g}</g>`;

  s += [[60, 900, 'r'], [100, 905, 'r'], [520, 920, 'd'], [-10, 820, 'd']].map(([x, y, k], i) => k === 'r' ? rabbit(x, y, 1, t, i) : deer(x, y, .55, t, i)).join('');

// ---------- CORTES (Shorts/TikTok): abertura própria + parte + chamada curta ----------
const SHORTS = {
  1: { open: ['Uma única frase da Bíblia esconde bilhões de estrelas.', 'galaxy', { count: 1 }] },
  2: { open: ['Na lista mais repetitiva da Bíblia, um homem quebra o padrão.', 'scroll', { rows: [...GEN.slice(4), ENOQUE] }] },
  3: { open: ['A arca de Noé e o cesto de Moisés têm a mesma palavra em hebraico.', 'hebrew', {}] },
  4: { open: ['Uma serva estrangeira, sozinha no deserto, deu um nome a Deus.', 'hagar', { flee: 1 }] },
  5: { open: ['Depois do primeiro pecado, Deus fez roupas. E isso diz muito.', 'eden', { give: 1, lookUp: 1, pose: 'surprise', emo: 'surprise' }], skipFirst: 1 },
};
const SHORT_CTA = ['Vídeo completo no canal Palavra Ensinada.', 'end', {}];

// ===== Montagem da linha do tempo, câmera, legendas e reprodução =====
const CPS = 17.2;          // ~170 palavras/min: ritmo ágil de narrador (estimativa até existir a narração final)
const CPS_SHORT = 18.2;    // Shorts: mesma voz ~6% mais rápida (ritmo de Shorts)
const GAP = 0.2;           // respiro entre falas
const SHOT = 2.6;          // troca de enquadramento a cada ~2,6 s
const XFADE = 0.35;        // transição entre cenas
const TAIL = 2.0;          // tela depois da última palavra
const SCENE_OY = { themeTitle: 0, recap: 0, end: 0, attributes: 0, comment: 0, hebrew: 0, galaxy: 0, scroll: 0, bibleIntro: 0 };

function buildScript(mode) {
  if (!mode || mode === 'full') return SCRIPT;
  const n = +mode, sh = SHORTS[n];
  let part = SCRIPT.filter(e => e.sec === n).map(e => ({ ...e, banner: null }));
  let card = null;
  if (sh.skipFirst) { card = part[0].card; part = part.slice(1); }
  return [{ t: sh.open[0], sc: sh.open[1], p: sh.open[2], sec: n, card, banner: SCRIPT.find(e => e.sec === n).banner }, ...part, { t: SHORT_CTA[0], sc: SHORT_CTA[1], p: SHORT_CTA[2], sec: 'cta' }];
}

function chunkText(text) {
  const words = text.replace(/\s+/g, ' ').trim().split(' ');
  const chunks = []; let cur = '';
  for (const w of words) {
    const nx = cur ? cur + ' ' + w : w;
    if (nx.length > 38 && cur) { chunks.push(cur); cur = w; }
    else { cur = nx; if (/[.,:;?!…]["”]?$/.test(w) && cur.length >= 18) { chunks.push(cur); cur = ''; } }
  }
  if (cur) chunks.push(cur);
  // junta sobras muito curtas
  for (let i = chunks.length - 1; i > 0; i--) if (chunks[i].length < 8 && (chunks[i - 1].length + chunks[i].length) < 44) { chunks[i - 1] += ' ' + chunks[i]; chunks.splice(i, 1); }
  return chunks;
}
function wrapLines(text, max) {
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) { const nx = cur ? cur + ' ' + w : w; if (nx.length > max && cur) { lines.push(cur); cur = w; } else cur = nx; }
  if (cur) lines.push(cur); return lines;
}

function buildTimeline(mode, timings) {
  const script = buildScript(mode);
  let T = 0.4; const segs = [];
  const cps = (!mode || mode === 'full') ? CPS : CPS_SHORT;
  script.forEach((e, i) => {
    const txt = e.t.replace(/"/g, '');
    let dur = Math.max(1.4, txt.length / cps);
    let start = T;
    if (timings && timings[i]) { start = timings[i][0]; dur = timings[i][1] - timings[i][0]; }
    const chunks = chunkText(txt); const tot = chunks.reduce((a, c) => a + c.length + 4, 0);
    let ct = start; const cs = chunks.map(c => { const d = dur * (c.length + 4) / tot; const o = { text: c, s: ct, e: ct + d, kw: findKeyword(c) }; ct += d; return o; });
    segs.push({ ...e, s: start, e: start + dur, chunks: cs, i });
    T = start + dur + GAP;
  });
  // blocos de cena contínuos
  const blocks = []; let bi = -1;
  segs.forEach(sg => {
    const key = sg.sc + JSON.stringify(sg.p);
    if (bi < 0 || blocks[bi].key !== key) { blocks.push({ key, sc: sg.sc, p: sg.p, s: bi < 0 ? 0 : sg.s - GAP / 2, idx: blocks.length }); bi++; }
    blocks[bi].e = sg.e + GAP / 2;
  });
  blocks.forEach((b, i) => { if (blocks[i + 1]) b.e = blocks[i + 1].s; });
  const total = segs[segs.length - 1].e + TAIL;
  blocks[blocks.length - 1].e = total;
  return { segs, blocks, total, mode };
}

function shotAt(shots, k, lt) {
  return shots[k % shots.length];
}
function camFor(block, lt, shots, first) {
  const n = shots.length; const start = first ?? (block.idx % n);
  const i = Math.floor(lt / SHOT); const f = (lt - i * SHOT) / SHOT;
  const cur = shots[(start + i) % n], prev = shots[(start + i - 1 + n) % n];
  const k = i === 0 ? 1 : ease(clamp((lt - i * SHOT) / 0.75, 0, 1));
  const z0 = prev.z * 1.035, z1 = cur.z * (1 + 0.035 * f);
  const lerpS = (a, b) => lerp(a, b, k);
  return { fx: lerpS(prev.fx, cur.fx), fy: lerpS(prev.fy, cur.fy), z: lerpS(z0, z1), sy: lerpS(prev.sy, cur.sy), drift: f };
}
function camTransform(c, oy) {
  const z = c.z, cx = c.fx, cy = c.fy + oy + (512 - c.sy) / z;
  const ccx = clamp(cx, 288 / z - 40, W - 288 / z + 40), ccy = clamp(cy, 512 / z - 40, H - 512 / z + 120);
  return `translate(288,512) scale(${f1(z * 1000) / 1000}) translate(${f1(-ccx)},${f1(-ccy)}) translate(0,${oy})`;
}
function renderScene(block, T) {
  const lt = T - block.s;
  const r = S[block.sc](lt, block.p);
  const oy = SCENE_OY[block.sc] ?? -90;
  const cam = camFor(block, lt, r.shots, r.first);
  return `<g transform="${camTransform(cam, oy)}">${r.svg}</g>${r.ov || ''}`;
}

const GOLD = '#ffd84d';
function subtitleSVG(ch, T) {
  const lines = wrapLines(ch.text, 22);
  const kw = ch.kw; const k = clamp((T - ch.s) / .12, 0, 1);
  const LH = 42, yb = 880, y0 = yb - (lines.length - 1) * LH;
  const wmax = Math.min(440, Math.max(...lines.map(l => l.length)) * 18.5 + 40);
  const box = '';
  const txt = lines.map((ln, i) => {
    let words = ln.split(' ').map(w => {
      const hit = kw && norm(w).replace(/[^a-z\s]/g, '').startsWith(kw.k.split(' ')[0]) || /^El$|^Roi/.test(w) && kw && kw.k === 'el roi';
      return `<tspan fill="${hit ? GOLD : '#fff'}">${esc(w)}</tspan>`;
    }).join(' ');
    return `<text x="288" y="${y0 + i * LH}" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="34" stroke="#000" stroke-width="7" stroke-linejoin="round" paint-order="stroke" filter="url(#tsh)" opacity="${f1(k)}">${words}</text>`;
  }).join('');
  return box + txt;
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function iconBadge(seg, T) {
  // ícone só em momentos escolhidos (p.badge na fala)
  const ic = seg.p && seg.p.badge; if (!ic || !ICONS[ic]) return '';
  const k = pop((T - seg.s - .3) / .35); if (k <= 0) return '';
  const fl = Math.sin(T * 2) * 3;
  return `<g transform="translate(438,${f1(470 + fl)}) scale(${f1(k * 1.3)})">${glow(0, 0, 60, '#fff3c4', .6)}<circle r="36" fill="#fff8e6" stroke="#d7a84a" stroke-width="3"/><g transform="scale(.9)">${ICONS[ic]()}</g></g>`;
}
function cardSVG(seg, T) {
  const c = seg.card; if (!c) return '';
  const k = easeOut((T - seg.s - .2) / .5); if (k <= 0) return '';
  const shade = `<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".62"/><stop offset=".75" stop-color="#000" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="576" height="${c.v ? 400 : 420}" fill="url(#tg)" opacity="${f1(k)}"/>`;
  if (c.ref) {
    const d0 = seg.banner ? 3.1 : 0;
    const kk = easeOut((T - seg.s - d0) / .45); if (kk <= 0) return '';
    const w = c.ref.length * 13 + 60;
    return `<g opacity="${f1(kk)}" transform="translate(288,${f1(190 - (1 - kk) * 10)})"><path d="M${-w / 2 - 14} 0 L${-w / 2} -22 L${w / 2} -22 L${w / 2 + 14} 0 L${w / 2} 22 L${-w / 2} 22Z" fill="#1a0f05" opacity=".72"/><path d="M${-w / 2 - 14} 0 L${-w / 2} -22 L${w / 2} -22 L${w / 2 + 14} 0 L${w / 2} 22 L${-w / 2} 22Z" fill="none" stroke="#d7a84a" stroke-width="2"/><text y="9" text-anchor="middle" font-family="'Times New Roman', 'Liberation Serif', serif" font-weight="bold" font-size="25" letter-spacing="2" fill="#ffd84d">${esc(c.ref)}</text></g>`;
  }
  if (c.v) {
    const lines = wrapLines(c.v, 30);
    const y0 = 196 + (lines.length > 4 ? -8 : 0);
    let s = lines.map((l, i) => `<text x="288" y="${y0 + i * 31}" text-anchor="middle" font-family="'Times New Roman', 'Liberation Serif', serif" font-size="26" font-style="italic" fill="${GOLD}" stroke="#2a1a00" stroke-width="3" paint-order="stroke">${esc(l)}</text>`).join('');
    s += `<text x="288" y="${y0 + lines.length * 31 + 10}" text-anchor="middle" font-family="'Times New Roman', 'Liberation Serif', serif" font-size="19" letter-spacing="2" fill="#f3e6c8" stroke="#2a1a00" stroke-width="3" paint-order="stroke">${esc(c.ref)}</text>`;
    return shade + `<g opacity="${f1(k)}" transform="translate(0,${f1((1 - k) * -10)})">${s}</g>`;
  }
  // frase de impacto: fonte de destaque (Cinzel Black), dourado com contorno e ornamentos
  const lines = wrapLines(c.impact, 15);
  const sc = pop((T - seg.s - .2) / .45);
  const gold = def('impG', '<linearGradient id="impG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffd84d"/><stop offset="1" stop-color="#d79a20"/></linearGradient>');
  const LH = 52, hh = (lines.length - 1) * LH;
  let s = lines.map((l, i) => `<text x="0" y="${i * LH}" text-anchor="middle" font-family="Cinzel, 'Liberation Serif', serif" font-weight="900" font-size="40" stroke="#1a0d00" stroke-width="8" stroke-linejoin="round" paint-order="stroke" filter="url(#tsh)">${l.split(' ').map(w => /\*/.test(w) ? `<tspan fill="${gold}">${esc(w.replace(/\*/g, ''))}</tspan>` : `<tspan fill="#fffaf0">${esc(w)}</tspan>`).join(' ')}</text>`).join('');
  const orn = y => `<g transform="translate(0,${y})"><line x1="-120" y1="0" x2="-22" y2="0" stroke="#ffd84d" stroke-width="2"/><line x1="22" y1="0" x2="120" y2="0" stroke="#ffd84d" stroke-width="2"/>${starShape(0, 0, 9, '#ffd84d')}</g>`;
  return shade + `<g transform="translate(288,${235 - hh / 2}) scale(${f1(sc)})">${orn(-48)}${s}${orn(hh + 26)}</g>`;
}
// Transição de parte: quadro com os 5 símbolos (o da vez em destaque) + título centralizado no topo
const PART_ICONS = ['star', 'steps', 'hebrew', 'eye', 'fur'];
function bannerSVG(seg, T) {
  const b = seg.banner; if (!b) return '';
  const lt = T - seg.s; if (lt > 3.4) return '';
  const k = easeOut(lt / .45) * (1 - easeOut((lt - 2.9) / .5));
  const lines = wrapLines(b.name.toUpperCase(), 19);
  const H = 128 + lines.length * 30, top = 162;
  let icons = '';
  PART_ICONS.forEach((ic, i) => {
    const on = i + 1 === b.n, x = -112 + i * 56, pk = on ? pop((lt - .25) / .5) : 1;
    icons += on
      ? `<g transform="translate(${x},40) scale(${f1(Math.max(.01, pk))})">${glow(0, 0, 44, '#ffd84d', .7)}<circle r="26" fill="#fff6cf" stroke="#ffd84d" stroke-width="4.5"/><g transform="scale(.66)">${ICONS[ic]().replace(/#ffd84d/g, ic === 'hebrew' ? '#8a1c2b' : '#ffd84d')}</g></g>`
      : `<g transform="translate(${x},40)" opacity="${i + 1 < b.n ? .75 : .45}"><circle r="19" fill="#3a2c20" stroke="#8a7458" stroke-width="1.5"/><g transform="scale(.46)" filter="url(#gray)">${ICONS[ic]()}</g>${i + 1 < b.n ? '<circle cx="13" cy="-13" r="6" fill="#4caf50"/><path d="M10 -13 l2 2 l4 -4" stroke="#fff" stroke-width="1.6" fill="none"/>' : ''}</g>`;
  });
  return `<g opacity="${f1(k)}" transform="translate(288,${f1(top + (1 - k) * -10)})" font-family="Liberation Sans, Arial" font-weight="bold" text-anchor="middle"><rect x="-160" y="0" width="320" height="${H}" rx="18" fill="#120a04" opacity=".72"/><rect x="-160" y="0" width="320" height="${H}" rx="18" fill="none" stroke="#d7a84a" stroke-width="2"/>${icons}<text y="98" font-size="16" letter-spacing="3" fill="#f3e6c8">${b.n}ª DESCOBERTA</text>${lines.map((l, i) => `<text y="${128 + i * 30}" font-size="25" fill="#ffd84d">${l}</text>`).join('')}</g>`;
}
function safeArea() {
  return `<g pointer-events="none"><rect x="0" y="0" width="576" height="154" fill="#ff0040" opacity=".25"/><rect x="0" y="665" width="576" height="359" fill="#ff0040" opacity=".25"/><rect x="474" y="154" width="102" height="511" fill="#ff0040" opacity=".25"/><rect x="0" y="154" width="34" height="511" fill="#ff0040" opacity=".25"/><rect x="34" y="154" width="440" height="511" fill="none" stroke="#ff0040" stroke-width="2" stroke-dasharray="6 6"/></g>`;
}

function frameSVG(TL, T, opts = {}) {
  const { blocks, segs, total } = TL;
  DEFS = {}; _uid = 0;
  let bi = blocks.findIndex(b => T >= b.s && T < b.e); if (bi < 0) bi = T < 0 ? 0 : blocks.length - 1;
  const b = blocks[bi];
  let world = renderScene(b, T);
  const tin = T - b.s;
  if (bi > 0 && tin < XFADE) world = renderScene(blocks[bi - 1], T) + `<g opacity="${f1(tin / XFADE)}">${world}</g>`;
  let ov = '';
  // fala atual (ou a última que terminou há pouco, para o cartão não sumir no respiro)
  const seg = segs.find(s => T >= s.s && T < s.e + GAP);
  if (seg) {
    ov += cardSVG(seg, T) + bannerSVG(seg, T);
    const ch = seg.chunks.find(c => T >= c.s && T < c.e) || (T >= seg.e ? null : null);
    ov += iconBadge(seg, T);
    if (ch) ov += subtitleSVG(ch, T);
  }
  const fadeIn = clamp(T / .6, 0, 1), fadeOut = clamp((total - T) / .8, 0, 1);
  const vign = `<defs><radialGradient id="vg" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="5"/></filter><filter id="gray"><feColorMatrix type="saturate" values="0"/></filter><filter id="tsh" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity=".8"/></filter></defs>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 1024" width="576" height="1024"><defs>${Object.values(DEFS).join('')}</defs>${vign}<rect width="576" height="1024" fill="#000"/>${world}<rect width="576" height="1024" fill="url(#vg)"/>${ov}${opts.safe ? safeArea() : ''}<rect width="576" height="1024" fill="#000" opacity="${f1(1 - Math.min(fadeIn, fadeOut))}"/></svg>`;
}

// ===== Página =====
let TL, playing = false, t0 = 0, Tcur = 0, audio = null, safeOn = false;
const qs = new URLSearchParams(location.search);
function setMode(m) { TL = buildTimeline(m, window.TIMINGS && window.TIMINGS[m || 'full']); Tcur = 0; draw(); updUI(); }
function draw() { document.getElementById('stage').innerHTML = frameSVG(TL, Tcur, { safe: safeOn }); }
window.renderAt = (T) => { Tcur = T; draw(); };
window.getTotal = () => TL.total;
window.setMode = setMode;
function fmt(s) { s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
function updUI() { const r = document.getElementById('seek'); if (!r) return; r.max = TL.total; r.value = Tcur; document.getElementById('tm').textContent = fmt(Tcur) + ' / ' + fmt(TL.total); }
function loop() {
  if (playing) {
    Tcur = audio && !audio.paused ? audio.currentTime : (performance.now() - t0) / 1000;
    if (Tcur >= TL.total) { playing = false; Tcur = TL.total; if (audio) audio.pause(); document.getElementById('pp').textContent = '▶'; }
    draw(); updUI();
  }
  requestAnimationFrame(loop);
}
function play() { playing = !playing; document.getElementById('pp').textContent = playing ? '❚❚' : '▶'; if (playing) { t0 = performance.now() - Tcur * 1000; if (audio) { audio.currentTime = Tcur; audio.play(); } } else if (audio) audio.pause(); }
window.addEventListener('DOMContentLoaded', () => {
  const render = qs.has('render');
  document.body.classList.toggle('render', render);
  setMode(qs.get('part') || 'full');
  if (render) return;
  document.getElementById('pp').onclick = play;
  document.getElementById('seek').oninput = e => { Tcur = +e.target.value; t0 = performance.now() - Tcur * 1000; if (audio) audio.currentTime = Tcur; draw(); updUI(); };
  document.getElementById('mode').onchange = e => { playing = false; if (audio) audio.pause(); document.getElementById('pp').textContent = '▶'; setMode(e.target.value); };
  document.getElementById('safe').onchange = e => { safeOn = e.target.checked; draw(); };
  document.getElementById('mp3').onchange = e => { const f = e.target.files[0]; if (!f) return; audio = new Audio(URL.createObjectURL(f)); document.getElementById('mp3l').textContent = '✓ ' + f.name; };
  const embedded = document.getElementById('narr'); if (embedded && embedded.src) audio = embedded;
  requestAnimationFrame(loop);
});
